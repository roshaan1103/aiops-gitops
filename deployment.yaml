apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aiops-app
  name: aiops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-app
  template:
    metadata:
      labels:
        app: aiops-app
    spec:
      containers:
      - name: aiops-app
        image: ghcr.io/roshaan1103/k8sagro-helm-app:4f9a475bef16a8ede605ef8bffdd50ab9e9d5821
        ports:
        - containerPort: 8000
