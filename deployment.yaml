apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-app
  template:
    metadata:
      labels:
        app: aiops-app
    spec:
      containers:
      - name: aiops-app
        image: ghcr.io/roshaan1103/k8sagro-helm-app:a29dbf305c7f65842ca3fc5d2e00f53dafb5d596
        ports:
        - containerPort: 8000
