apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-app
  template:
    metadata:
      labels:
        app: aiops-app
    spec:
      containers:
      - name: aiops-app
        image: ghcr.io/roshaan1103/k8sagro-helm-app:aab57b13d417df59762e12390505699fd16e790c
        ports:
        - containerPort: 8000
