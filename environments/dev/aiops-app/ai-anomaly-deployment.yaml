apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-anomaly-service
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-anomaly-service
  template:
    metadata:
      labels:
        app: ai-anomaly-service
    spec:
      serviceAccountName: ai-anomaly-sa
      containers:
      - name: ai-anomaly-service
        image: ghcr.io/roshaan1103/ai-anomaly-service:ee029678cee2e6f2d77718a70f9fbadcc9cfa8e1
        ports:
        - containerPort: 8000
