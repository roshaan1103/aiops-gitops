apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-anomaly-service
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-anomaly-service
  template:
    metadata:
      labels:
        app: ai-anomaly-service
    spec:
      serviceAccountName: ai-anomaly-sa
      containers:
      - name: ai-anomaly-service
        image: ghcr.io/roshaan1103/ai-anomaly-service:2da7395002065eee8a9a1ac59e928ec5041c1425
        ports:
        - containerPort: 8000
