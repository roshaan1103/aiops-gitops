apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../apps/aiops-app
  - argocd-ingress.yaml
  - grafana-ingress.yaml
  - argocd-tls.yaml
  - grafana-tls.yaml
  - grafana-datasource.yaml
  - grafana-dashboard-provider.yaml
  - grafana-dashboard-config.yaml

patches:
  - target:
      kind: Deployment
      name: aiops-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
