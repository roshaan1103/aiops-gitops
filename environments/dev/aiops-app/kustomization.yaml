apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../apps/aiops-app

  - aiops-app.yaml

  # AI Anomaly Service
  - ai-anomaly-deployment.yaml
  - ai-anomaly-service.yaml
  - ai-anomaly-servicemonitor.yaml

  # Observability
  - grafana-dashboard-config.yaml
  - grafana-dashboard-provider.yaml
  - grafana-datasource.yaml

  # Ingress
  - grafana-ingress.yaml
  - grafana-tls.yaml
  - argocd-ingress.yaml
  - argocd-tls.yaml


patches:
  - target:
      kind: Deployment
      name: aiops-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
