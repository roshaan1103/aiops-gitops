apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-prometheus-kube-prometheus-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: "ai-webhook"
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1m

    receivers:
    - name: "ai-webhook"
      webhook_configs:
      - url: "http://ai-anomaly-service.monitoring.svc.cluster.local:8000/alert"
        send_resolved: true
