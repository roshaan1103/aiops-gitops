apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  aiops-dashboard.json: |
    {
      "title": "AIOps App Dashboard",
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU Usage",
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{pod=~\"aiops-app.*\"}[5m])",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory Usage",
          "targets": [
            {
              "expr": "container_memory_usage_bytes{pod=~\"aiops-app.*\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
