apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  aiops-dashboard.json: |
    {
      "title": "AIOps Dashboard",
      "timezone": "browser",
      "panels": [
        {
          "type": "graph",
          "title": "CPU Usage",
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total[1m])",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        }
      ],
      "schemaVersion": 16,
      "version": 1
    }
