apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aiops-app
  name: aiops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-app
  template:
    metadata:
      labels:
        app: aiops-app
    spec:
      containers:
      - name: aiops-app
        image: ghcr.io/roshaan1103/k8sagro-helm-app:0fc0cc06b07b4f8e183d50f26b3613478bbe934c
        ports:
        - containerPort: 8000
