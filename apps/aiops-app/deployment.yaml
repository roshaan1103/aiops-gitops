apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aiops-app
  name: aiops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-app
  template:
    metadata:
      labels:
        app: aiops-app
    spec:
      containers:
      - name: aiops-app
        image: ghcr.io/roshaan1103/k8sagro-helm-app:d7de5cddceaace320893f960bda79fb939436b61
        ports:
        - containerPort: 8000
