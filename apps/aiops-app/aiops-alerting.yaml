apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiops-alerts
  namespace: monitoring
spec:
  groups:
  - name: aiops.rules
    rules:
    - alert: AiopsPodDown
      expr: kube_pod_status_phase{phase="Running",namespace="default",pod=~"aiops-app.*"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AiOps pod is down!"
